name: "Freeman: E3 Edge browser proxy tunnel"

on:
  workflow_dispatch:
    inputs:
      hold_seconds:
        description: "Maximum tunnel lifetime in seconds (60-18000 = 5h max)"
        required: true
        default: "300"
        type: string
  # push trigger was needed pre-merge because workflow_dispatch requires the
  # workflow on the default branch; remove this hunk once the PR merges.
  # push trigger was needed pre-merge because workflow_dispatch requires the
  # workflow on the default branch; remove this hunk once the PR merges.
  # push:
  #   branches:
  #     - experiment/e3-edge-browser-proxy

permissions:
  contents: read

concurrency:
  group: freeman-e3-edge-proxy
  cancel-in-progress: true

jobs:
  e3-proxy-tunnel:
    name: Run temporary authenticated proxy tunnel
    runs-on: ubuntu-latest
    # 5h hold + setup buffer; GitHub-hosted jobs cap at 360 minutes
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned experiment dependencies
        run: python -m pip install --disable-pip-version-check -r experiments/e3-requirements.txt

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start proxy relay and temporary HTTPS tunnel
        env:
          E3_TUNNEL_TOKEN: ${{ secrets.E3_TUNNEL_TOKEN }}
          # push events have no dispatch inputs; fall back to the documented default
          E3_HOLD_SECONDS: ${{ inputs.hold_seconds || '300' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${E3_TUNNEL_TOKEN}" ]]; then
            echo "::error::Configure repository Actions secret E3_TUNNEL_TOKEN before running E3."
            exit 1
          fi
          if ! [[ "$E3_HOLD_SECONDS" =~ ^[0-9]+$ ]] || (( E3_HOLD_SECONDS < 60 || E3_HOLD_SECONDS > 18000 )); then
            echo "::error::hold_seconds must be an integer between 60 and 18000."
            exit 1
          fi
          RUNNER_EGRESS_IP=$(curl --fail --silent --show-error --max-time 10 https://api.ipify.org)
          echo "E3_RUNNER_EGRESS_IP=$RUNNER_EGRESS_IP"
          python experiments/e3_tunnel_server.py &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            if [[ -n "${TUNNEL_PID:-}" ]]; then kill "$TUNNEL_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/health >/dev/null
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8765 > /tmp/e3-cloudflared.log 2>&1 &
          TUNNEL_PID=$!
          for _ in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/e3-cloudflared.log | head -n1 || true)
            if [[ -n "$URL" ]]; then break; fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then cat /tmp/e3-cloudflared.log; exit 1; fi
            sleep 1
          done
          if [[ -z "${URL:-}" ]]; then
            echo "::error::Timed out waiting for Quick Tunnel URL."
            cat /tmp/e3-cloudflared.log
            exit 1
          fi
          echo "E3_TUNNEL_URL=$URL"
          echo "E3_STATUS_URL=$URL/health"
          echo "The proxy tunnel is temporary. Keep this job running while testing; do not share the URL or token."
          sleep "$E3_HOLD_SECONDS"
        timeout-minutes: 325
